workflows:
  capacitor_android_ci:
    name: Capacitor Android (APK) — CI-generated (Capacitor 6, signed)
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events: [ push, tag ]
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      groups:
        - android_credentials      # ANDROID_KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      vars:
        APP_NAME: "Shared Grocery List"
        PACKAGE_NAME: "com.example.grocery"
        WEB_DIR: "dist"
        CAP_VERSION: "6.1.2"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $CM_BUILD_DIR/node_modules

    scripts:
      - name: Decode keystore
        script: |
          python3 - << 'PY'
          import os, base64, sys
          data = os.environ.get('ANDROID_KEYSTORE', '').strip()
          if not data:
            sys.exit("ANDROID_KEYSTORE is empty. Check your env var.")
          out = os.path.join(os.environ.get('CM_BUILD_DIR', '.'), 'keystore.jks')
          with open(out, 'wb') as f:
            f.write(base64.b64decode(data))
          print("Wrote:", out)
          PY

      - name: Tool versions
        script: |
          node -v || true
          npm -v || true
          java -version || true

      - name: Init npm project & install Capacitor (v6)
        script: |
          npm init -y
          npm install @capacitor/core@${CAP_VERSION} @capacitor/cli@${CAP_VERSION} @capacitor/android@${CAP_VERSION} --legacy-peer-deps

      - name: Prepare web assets
        script: |
          mkdir -p "$WEB_DIR"
          cp -a index.html "$WEB_DIR/index.html"

      - name: Create capacitor.config.json
        script: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "__PKG__",
            "appName": "__APP__",
            "webDir": "__WEB__",
            "server": { "androidScheme": "https" }
          }
          EOF
          sed -i.bak "s/__PKG__/${PACKAGE_NAME}/" capacitor.config.json
          sed -i.bak "s/__APP__/${APP_NAME}/" capacitor.config.json
          sed -i.bak "s/__WEB__/${WEB_DIR}/" capacitor.config.json

      - name: Add Android & sync
        script: |
          npx cap add android
          npx cap sync android

      - name: Ensure Android SDK packages
        script: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build release APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean :app:assembleRelease --stacktrace --warning-mode all -x lint

      - name: Sign & align APK
        script: |
          set -e
          APK_UNALIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_ALIGNED="$CM_BUILD_DIR/artifacts/app-release-aligned.apk"
          APK_SIGNED="$CM_BUILD_DIR/artifacts/app-release-signed.apk"

          # Create artifacts folder
          mkdir -p "$CM_BUILD_DIR/artifacts"

          # Locate build-tools
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}"
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          echo "Using build-tools at: $BT"
          ls -l "$BT" || true

          # Zipalign BEFORE signing
          "$BT/zipalign" -v 4 "$APK_UNALIGNED" "$APK_ALIGNED"

          # Sign with keystore decoded earlier
          "$BT/apksigner" sign \
            --ks "$CM_BUILD_DIR/keystore.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$APK_SIGNED" \
            "$APK_ALIGNED"

          # Verify signature
          "$BT/apksigner" verify "$APK_SIGNED"
          echo "Signed APK at: $APK_SIGNED"

      - name: List build outputs
        script: |
          echo "===== OUTPUT TREE ====="
          (cd android/app/build/outputs && pwd && find . -type f -maxdepth 5 -print) || true
          echo "===== ARTIFACTS ====="
          ls -al "$CM_BUILD_DIR/artifacts" || true

    artifacts:
      - artifacts/*.apk

    publishing:
      email:
        recipients:
          - you@example.com
        notify:
          success: true
          failure: true
