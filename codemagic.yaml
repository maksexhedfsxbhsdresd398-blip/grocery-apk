workflows:
  capacitor_android_ci:
    name: Capacitor Android (APK) — CI-generated (Capacitor 6)
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events: [ push, tag ]
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      groups:
        - android_credentials
      vars:
        APP_NAME: "Shared Grocery List"
        PACKAGE_NAME: "com.example.grocery"
        WEB_DIR: "dist"
        CAP_VERSION: "6.1.2"   # Capacitor 6 pinned (core/cli/android)
      # (Codemagic mac images default to Java 17; leave as-is)

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $CM_BUILD_DIR/node_modules

    scripts:
      - name: Decode keystore
        script: |
          python3 - << 'PY'
          import os, base64, sys
          data = os.environ.get('ANDROID_KEYSTORE', '').strip()
          if not data:
            sys.exit("ANDROID_KEYSTORE is empty. Check your env var.")
          out = os.path.join(os.environ.get('CM_BUILD_DIR', '.'), 'keystore.jks')
          with open(out, 'wb') as f:
            f.write(base64.b64decode(data))
          print("Wrote:", out)
          PY

      - name: Tool versions
        script: |
          node -v || true
          npm -v || true
          java -version || true

      - name: Init npm project & install Capacitor (v6)
        script: |
          npm init -y
          npm install @capacitor/core@${CAP_VERSION} @capacitor/cli@${CAP_VERSION} @capacitor/android@${CAP_VERSION} --legacy-peer-deps

      - name: Prepare web assets
        script: |
          mkdir -p "$WEB_DIR"
          cp -a index.html "$WEB_DIR/index.html"

      - name: Create capacitor.config.json
        script: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "__PKG__",
            "appName": "__APP__",
            "webDir": "__WEB__",
            "server": { "androidScheme": "https" }
          }
          EOF
          sed -i.bak "s/__PKG__/${PACKAGE_NAME}/" capacitor.config.json
          sed -i.bak "s/__APP__/${APP_NAME}/" capacitor.config.json
          sed -i.bak "s/__WEB__/${WEB_DIR}/" capacitor.config.json

      - name: Add Android & sync
        script: |
          npx cap add android
          npx cap sync android

      - name: Ensure Android SDK packages
        script: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build APK/AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean :app:assembleRelease :app:bundleRelease \
            --stacktrace --warning-mode all -x lint

      - name: List build outputs
        script: |
          echo "===== OUTPUT TREE ====="
          (cd android/app/build/outputs && pwd && find . -type f -maxdepth 5 -print) || true

      - name: Collect artifacts
        script: |
          mkdir -p "$CM_BUILD_DIR/artifacts"
          find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print -exec cp {} "$CM_BUILD_DIR/artifacts/" \; || true
          echo "Artifacts copied to $CM_BUILD_DIR/artifacts:"
          ls -al "$CM_BUILD_DIR/artifacts" || true

    artifacts:
      - artifacts/*.apk
      - artifacts/*.aab

    publishing:
      email:
        recipients:
          - you@example.com
        notify:
          success: true
          failure: true
